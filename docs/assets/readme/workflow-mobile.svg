<svg xmlns="http://www.w3.org/2000/svg" width="680" height="478" viewBox="0 0 680 478" role="img" aria-labelledby="title desc">
<title id="title">Record. Refine. Share.</title><desc id="desc">Capture your journey, edit your way, and publish saved routes to APR.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d32"/><stop offset="1" stop-color="#131525"/></linearGradient></defs>
<rect x="1" y="1" width="678" height="476" rx="20" fill="url(#bg)" stroke="#33425b"/>
<path d="M30 159H650M30 318H650" stroke="#33425b"/>
<g font-family="Segoe UI,Arial,sans-serif">
<circle cx="40" cy="38" r="7" fill="#f0b65c"/><text x="59" y="45" font-size="20" font-weight="700" letter-spacing="3" fill="#f0b65c">RECORD</text>
<text x="30" y="90" font-size="32" font-weight="650" fill="#f2f5fa">Capture your journey.</text><text x="30" y="128" font-size="24" fill="#a6b5cc">Quests, travel, dialogue, and more.</text>
<rect x="33" y="190" width="14" height="14" rx="3" fill="#6ecbdf"/><text x="59" y="204" font-size="20" font-weight="700" letter-spacing="3" fill="#6ecbdf">REFINE</text>
<text x="30" y="249" font-size="32" font-weight="650" fill="#f2f5fa">Edit your way.</text><text x="30" y="287" font-size="24" fill="#a6b5cc">Visual workshop or full Lua editor.</text>
<path d="m40 349 7 7-7 7-7-7z" fill="#b5a1ef"/><text x="59" y="363" font-size="20" font-weight="700" letter-spacing="3" fill="#b5a1ef">SHARE</text>
<text x="30" y="408" font-size="32" font-weight="650" fill="#f2f5fa">Bring your route to APR.</text><text x="30" y="446" font-size="24" fill="#a6b5cc">Save once. Find it in the Custom tab.</text>
</g></svg>
