name: Discord Release Notification

on:
  release:
    types: [published]  # Triggers on newly published releases
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to notify'
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify-discord:
    if: github.repository == 'Azeroth-Pilot-Reloaded/APR-Route-Recorder'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests python-dotenv

      - name: Post release notes to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_BODY="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
            export RELEASE_BODY
          fi
          python .github/scripts/post_discord.py
